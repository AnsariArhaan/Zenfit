<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZENFIT — Log In</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="common.css">
<link rel="stylesheet" href="login.css">
</head>
<body>

<div id="floatingLayer"></div>

<div id="pulseTransition">
  <svg viewBox="0 0 600 100"><path d="M0,50 L180,50 L210,10 L240,90 L270,50 L600,50"/></svg>
</div>

<header>
  <nav class="wrap">
    <div class="brand">
      <span class="beat">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 12h4l2 8 4-16 3 12 2-4h5"/></svg>
      </span>
      ZENFIT
    </div>
    <ul class="nav-links" id="navLinks">
      <li><button onclick="location.href='home.html'">Home</button></li>
      <li><button onclick="location.href='workouts.html'">Workouts</button></li>
      <li><button onclick="location.href='tracker.html'">Tracker</button></li>
      <li><button onclick="location.href='supplements.html'">Supplements</button></li>
      <li><button onclick="location.href='blog.html'">Blog</button></li>
      <li><button onclick="location.href='about.html'">About</button></li>
    </ul>
    <div class="nav-actions">
      <button class="btn btn-solid" onclick="location.href='home.html'">Back to Home</button>
      <button class="hamburger" onclick="document.getElementById('navLinks').classList.toggle('open')"><i class="fa-solid fa-bars"></i></button>
    </div>
  </nav>
</header>

<main>
  <section class="page active" id="login">
    <div class="wrap">
      <div class="login-shell">
        <div class="modal-panel">
          <div class="modal-tabs">
            <button id="tabLogin" onclick="switchAuthTab('login')">Log In</button>
            <button id="tabSignup" onclick="switchAuthTab('signup')">Sign Up</button>
          </div>
          <div class="form-view" id="viewLogin">
            <input id="loginEmail" type="email" placeholder="Email" autocomplete="email" required>
            <input id="loginPassword" type="password" placeholder="Password" autocomplete="current-password" required>
            <button class="btn btn-solid" id="loginButton" type="button">Log In</button>
          </div>
          <div class="form-view" id="viewSignup">
            <input id="signupName" type="text" placeholder="Full name" autocomplete="name" required>
            <input id="signupEmail" type="email" placeholder="Email" autocomplete="email" required>
            <input id="signupPassword" type="password" placeholder="Password (at least 6 characters)" autocomplete="new-password" minlength="6" required>
            <button class="btn btn-solid" id="signupButton" type="button">Create Account</button>
          </div>
        </div>
      </div>
    </div>
  </section>
</main>

<footer>
  <div class="wrap">ZENFIT — student project prototype · built for better habits, not just better numbers.</div>
</footer>

<div id="toastHost"></div>

<script src="common.js"></script>
<script src="login.js"></script>
</body>
</html>
